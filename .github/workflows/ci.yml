name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - file
          - storage
          - sharing

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  compose:
    name: Compose smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start application stack
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Check service readiness
        run: |
          for port in 8080 8081 8082 8083 8084; do
            curl --fail --silent --show-error "http://localhost:${port}/actuator/health/readiness" |
              jq --exit-status '.status == "UP"'
          done

      - name: Check OpenAPI documents
        run: |
          for port in 8080 8081 8082 8083 8084; do
            curl --fail --silent --show-error "http://localhost:${port}/v3/api-docs" |
              jq --exit-status '.openapi and .info.title'
          done

      - name: Check API error contracts
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import uuid
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          
          
          def send(base, path, method="GET", data=None, token=None, content_type="application/json"):
              headers = {"Content-Type": content_type} if data is not None else {}
              if token:
                  headers["Authorization"] = "Bearer " + token
              request = Request(base + path, data=data, method=method, headers=headers)
              try:
                  response = urlopen(request, timeout=10)
              except HTTPError as error:
                  response = error
              with response:
                  body = response.read()
                  return response.status, json.loads(body) if body else None, response.headers
          
          
          def assert_contract(status, body, headers, expected_path):
              assert body["status"] == status, body
              assert body["code"] == {
                  502: "BAD_GATEWAY",
                  504: "GATEWAY_TIMEOUT",
              }.get(status, body["code"]), body
              assert body["path"] == expected_path, body
              assert body["timestamp"] and body["message"], body
              assert headers.get_content_type() == "application/json", headers
          
          
          def check(base, path, status, code, *, expected_path=None, fields=False, **kwargs):
              actual, body, headers = send(base, path, **kwargs)
              assert actual == status, (base, path, actual, body)
              assert body["code"] == code, body
              assert_contract(actual, body, headers, expected_path or path)
              assert bool(body.get("fieldErrors")) if fields else "fieldErrors" not in body, body
              return body, headers
          
          
          for port in range(8080, 8085):
              base = f"http://localhost:{port}"
              for path in ["/", "/unknown-endpoint"]:
                  check(base, path, 404, "NOT_FOUND")
          check("http://localhost", "/", 404, "NOT_FOUND")
          check("http://localhost:8081", "/user/me", 401, "UNAUTHORIZED")
          check("http://localhost:8080", "/api/files/nodes", 401, "UNAUTHORIZED")
          
          for base, prefix in [
              ("http://localhost:8081", ""),
              ("http://localhost:8080", "/api/identity"),
              ("http://localhost", "/api/identity"),
          ]:
              check(base, prefix + "/auth/login", 400, "BAD_REQUEST", method="POST", data=b"{",
                    expected_path="/auth/login")
              _, headers = check(base, prefix + "/auth/login", 405, "METHOD_NOT_ALLOWED",
                                 expected_path="/auth/login")
              assert "POST" in headers["Allow"], headers
              check(base, prefix + "/auth/register", 400, "BAD_REQUEST", method="POST",
                    data=b'{"email":"invalid","password":"short"}',
                    expected_path="/auth/register", fields=True)
          
          credentials = json.dumps({
              "email": f"errors-{uuid.uuid4()}@example.com",
              "password": "Password123",
          }).encode()
          identity = "http://localhost:8081"
          status, _, _ = send(identity, "/auth/register", "POST", credentials)
          assert status == 201, status
          status, login, _ = send(identity, "/auth/login", "POST", credentials)
          assert status == 200, (status, login)
          token = login["accessToken"]
          
          for base in ["http://localhost:8080", "http://localhost"]:
              for service in ["identity", "files", "sharing"]:
                  check(base, f"/api/{service}/unknown-endpoint", 404, "NOT_FOUND",
                        expected_path="/unknown-endpoint", token=token)
              check(base, "/api/files/internal/nodes/1", 403, "FORBIDDEN", token=token)
          
          subprocess.run(["docker", "compose", "stop", "identity"], check=True)
          subprocess.run(["docker", "compose", "rm", "--force", "identity"], check=True)
          
          for base in ["http://localhost:8080", "http://localhost"]:
              path = "/api/identity/auth/login"
              status, body, headers = send(base, path, method="POST", data=b"{}")
              assert status in {502, 504}, (base, path, status, body)
              assert_contract(status, body, headers, path)
              assert "fieldErrors" not in body, body
          
          print("Direct service, Gateway, Nginx, and unavailable-upstream error checks passed")
          
          PY

      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
