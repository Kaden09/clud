spring:
  application:
    name: identity
  datasource:
    url: ${IDENTITY_DATABASE_URL:jdbc:postgresql://localhost:5432/clud}
    username: ${IDENTITY_DATABASE_USERNAME:clud}
    password: ${IDENTITY_DATABASE_PASSWORD:clud}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: ${IDENTITY_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${IDENTITY_DDL_AUTO:validate}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
    http-only: ${COOKIE_HTTP_ONLY:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
    path: ${COOKIE_PATH:/}
