server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity
  datasource:
    url: ${IDENTITY_DATABASE_URL}
    username: ${IDENTITY_DATABASE_USERNAME}
    password: ${IDENTITY_DATABASE_PASSWORD}
  flyway:
    create-schemas: true
    default-schema: identity_service
    schemas: identity_service
  jpa:
    open-in-view: false
    show-sql: ${IDENTITY_SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity_service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    path: ${COOKIE_PATH:/api/identity/auth}

clud:
  identity:
    events-topic: ${IDENTITY_EVENTS_TOPIC:identity.events.v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
