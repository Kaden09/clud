server:
  servlet:
    context-path: /api
  port: ${IDENTITY_PORT:8081}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/identity
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  application:
    name: identity
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


jwt:
  secret: 119d3bc12fe8a3b8e571094aa900744560e08dcbc82f4c5dcc3e9c30291448ac8c1f7dcea8351c939d921b561715d1cfdc2202a4e5d72c53d50234390c8b680b
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  cookie:
    secure: false
    http-only: true
    same-site: Lax
    path: /
