server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  http:
    clients:
      connect-timeout: 2s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
            - id: file
              uri: ${FILE_SERVICE_URL}
              predicates:
                - Path=/api/files/**
              filters:
                - StripPrefix=2
            - id: sharing
              uri: ${SHARING_SERVICE_URL}
              predicates:
                - Path=/api/sharing/**
              filters:
                - StripPrefix=2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET}

app:
  rate-limit:
    enabled: true
    fail-open: true
    default-limit-per-minute: 60
    limits:
      - path: /api/identity/auth/**
        per-minute: 10
      - path: /api/sharing/public/**
        per-minute: 30
    skipped-paths:
      - /actuator/**
      - /v3/api-docs/**
      - /docs/**
      - /swagger-ui/**
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    urls:
      - name: Gateway
        url: /v3/api-docs
      - name: Identity
        url: /api/identity/v3/api-docs
      - name: File
        url: /api/files/v3/api-docs
      - name: Sharing
        url: /api/sharing/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
