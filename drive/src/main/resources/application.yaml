server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: drive
  datasource:
    url: ${DRIVE_DATABASE_URL}
    username: ${DRIVE_DATABASE_USERNAME}
    password: ${DRIVE_DATABASE_PASSWORD}
  flyway:
    create-schemas: true
    default-schema: drive_service
    schemas: drive_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: drive_service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

clud:
  drive:
    events-topic: ${DRIVE_EVENTS_TOPIC:drive.events.v1}
    storage-service-url: ${STORAGE_SERVICE_URL:http://localhost:8083}
    max-file-bytes: ${DRIVE_MAX_UPLOAD_BYTES:524288000}
    quota:
      max-bytes: ${DRIVE_MAX_BUCKET_BYTES:10737418240}
    http:
      connect-timeout: ${DRIVE_STORAGE_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${DRIVE_STORAGE_HTTP_READ_TIMEOUT:30s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
