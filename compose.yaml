name: clud

services:
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  gateway:
    build: ./gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT}:8080"
    environment:
      SERVER_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      SHARING_SERVICE_URL: ${SHARING_SERVICE_URL}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set JWT_SECRET}"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: 6379
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED: true
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  identity:
    build: ./identity
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT}:8080"
    environment:
      SERVER_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      IDENTITY_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      IDENTITY_DATABASE_USERNAME: ${POSTGRES_USER}
      IDENTITY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_SHOW_SQL: ${IDENTITY_SHOW_SQL}
      IDENTITY_EVENTS_TOPIC: ${IDENTITY_EVENTS_TOPIC}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set JWT_SECRET}"
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
      COOKIE_PATH: ${COOKIE_PATH}
      OTEL_SERVICE_NAME: identity
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  file:
    build: ./file
    ports:
      - "127.0.0.1:${FILE_HOST_PORT}:8080"
    environment:
      SERVER_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      FILE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FILE_DATABASE_USERNAME: ${POSTGRES_USER}
      FILE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FILE_EVENTS_TOPIC: ${FILE_EVENTS_TOPIC}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      FILE_STORAGE_HTTP_CONNECT_TIMEOUT: ${FILE_STORAGE_HTTP_CONNECT_TIMEOUT}
      FILE_STORAGE_HTTP_READ_TIMEOUT: ${FILE_STORAGE_HTTP_READ_TIMEOUT}
      OTEL_SERVICE_NAME: file
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      storage:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  storage:
    build: ./storage
    ports:
      - "127.0.0.1:${STORAGE_HOST_PORT}:8080"
    environment:
      SERVER_PORT: "8080"
      MINIO_URL: ${MINIO_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      OTEL_SERVICE_NAME: storage
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED: true
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  sharing:
    build: ./sharing
    ports:
      - "127.0.0.1:${SHARING_HOST_PORT}:8080"
    environment:
      SERVER_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SHARING_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SHARING_DATABASE_USERNAME: ${POSTGRES_USER}
      SHARING_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      SHARING_PUBLIC_BASE_URL: ${SHARING_PUBLIC_BASE_URL}
      SHARING_HTTP_CONNECT_TIMEOUT: ${SHARING_HTTP_CONNECT_TIMEOUT}
      SHARING_HTTP_READ_TIMEOUT: ${SHARING_HTTP_READ_TIMEOUT}
      SHARING_STORAGE_HTTP_CONNECT_TIMEOUT: ${SHARING_STORAGE_HTTP_CONNECT_TIMEOUT}
      SHARING_STORAGE_HTTP_READ_TIMEOUT: ${SHARING_STORAGE_HTTP_READ_TIMEOUT}
      FILE_EVENTS_TOPIC: ${FILE_EVENTS_TOPIC}
      SHARING_EVENTS_TOPIC: ${SHARING_EVENTS_TOPIC}
      OTEL_SERVICE_NAME: sharing
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      file:
        condition: service_healthy
      storage:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_URL: ${MINIO_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    depends_on:
      - gateway
      - identity
      - file
      - storage
      - sharing

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.7.7
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki

  tempo:
    image: grafana/tempo:3.0.3
    ports:
      - "127.0.0.1:${TEMPO_PORT}:3200"
    restart: unless-stopped
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo

  alloy:
    image: grafana/alloy:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALLOY_PORT}:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
  grafana-data:
  prom_data:
  loki-data:
  tempo-data:
  alloy-data:
