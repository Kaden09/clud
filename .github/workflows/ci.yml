name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - file
          - storage
          - sharing

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  compose:
    name: Compose smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start application stack
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Check public entrypoint
        run: |
          status=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            "http://localhost/unknown-endpoint")

          test "$status" = "404"

      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
