spring:
  application:
    name: identity
  datasource:
    url: ${IDENTITY_DATABASE_URL:jdbc:postgresql://localhost:5432/clud}
    username: ${IDENTITY_DATABASE_USERNAME:clud}
    password: ${IDENTITY_DATABASE_PASSWORD:clud}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # Отдельная схема не позволяет миграциям Identity пересекаться с другими сервисами общей БД.
    create-schemas: true
    default-schema: identity_service
    schemas: identity_service
  jpa:
    open-in-view: false
    show-sql: ${IDENTITY_SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity_service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    path: ${COOKIE_PATH:/api/auth}

server:
  servlet:
    context-path: /api
