server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  http:
    clients:
      connect-timeout: 2s
      read-timeout: ${GATEWAY_HTTP_READ_TIMEOUT:30s}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-openapi
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/identity
              filters:
                - SetPath=/v3/api-docs
            - id: file-openapi
              uri: ${FILE_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/files
              filters:
                - SetPath=/v3/api-docs
            - id: sharing-openapi
              uri: ${SHARING_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/sharing
              filters:
                - SetPath=/v3/api-docs
            - id: identity
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
            - id: file
              uri: ${FILE_SERVICE_URL}
              predicates:
                - Path=/api/files/**
              filters:
                - StripPrefix=2
            - id: sharing
              uri: ${SHARING_SERVICE_URL}
              predicates:
                - Path=/api/sharing/**
              filters:
                - StripPrefix=2
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:clud-identity}
  audience: ${JWT_AUDIENCE:clud-api}

app:
  rate-limit:
    enabled: true
    fail-open: true
    default-limit-per-minute: 60
    limits:
      - path: /api/identity/auth/**
        per-minute: 10
      - path: /api/sharing/public/**
        per-minute: 30
    skipped-paths:
      - /actuator/**
      - /v3/api-docs/identity
      - /v3/api-docs/files
      - /v3/api-docs/sharing
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
