global:
  scrape_interval: 2s

scrape_configs:
  - job_name: 'gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']


  - job_name: 'identity'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['identity:8080']


  - job_name: 'file'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'file:8080' ]


  - job_name: 'storage'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'storage:8080' ]


  - job_name: 'sharing'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'sharing:8080' ]
