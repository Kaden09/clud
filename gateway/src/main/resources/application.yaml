spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
            - id: file
              uri: ${FILE_SERVICE_URL}
              predicates:
                - Path=/api/files/**
              filters:
                - StripPrefix=2
            - id: storage
              uri: ${STORAGE_SERVICE_URL}
              predicates:
                - Path=/api/storage/**
              filters:
                - StripPrefix=2
            - id: sharing
              uri: ${SHARING_SERVICE_URL}
              predicates:
                - Path=/api/sharing/**
              filters:
                - StripPrefix=2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
