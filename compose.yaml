services:
  nginx:
    build:
      context: ./nginx
    container_name: clud-nginx
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  gateway:
    build:
      context: ./gateway
    container_name: clud-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      SHARING_SERVICE_URL: ${SHARING_SERVICE_URL}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  identity:
    build:
      context: ./identity
    container_name: clud-identity
    ports:
      - "${IDENTITY_PORT}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      IDENTITY_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      IDENTITY_DATABASE_USERNAME: ${POSTGRES_USER}
      IDENTITY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_SHOW_SQL: ${IDENTITY_SHOW_SQL}
      IDENTITY_EVENTS_TOPIC: ${IDENTITY_EVENTS_TOPIC}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set JWT_SECRET}"
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
      COOKIE_PATH: ${COOKIE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  file:
    build:
      context: ./file
    container_name: clud-file
    ports:
      - "${FILE_PORT}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      FILE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FILE_DATABASE_USERNAME: ${POSTGRES_USER}
      FILE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FILE_EVENTS_TOPIC: ${FILE_EVENTS_TOPIC}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  storage:
    build:
      context: ./storage
    container_name: clud-storage
    ports:
      - "${STORAGE_PORT}:8080"
    environment:
      MINIO_URL: ${MINIO_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  sharing:
    build:
      context: ./sharing
    container_name: clud-sharing
    ports:
      - "${SHARING_PORT}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SHARING_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SHARING_DATABASE_USERNAME: ${POSTGRES_USER}
      SHARING_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      SHARING_PUBLIC_BASE_URL: ${SHARING_PUBLIC_BASE_URL}
      SHARING_HTTP_CONNECT_TIMEOUT: ${SHARING_HTTP_CONNECT_TIMEOUT}
      SHARING_HTTP_READ_TIMEOUT: ${SHARING_HTTP_READ_TIMEOUT}
      FILE_EVENTS_TOPIC: ${FILE_EVENTS_TOPIC}
      SHARING_EVENTS_TOPIC: ${SHARING_EVENTS_TOPIC}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      file:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    container_name: clud-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: clud-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: clud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_URL: ${MINIO_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    container_name: clud-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
